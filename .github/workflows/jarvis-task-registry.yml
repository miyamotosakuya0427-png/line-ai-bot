name: ONE JARVIS Task Registry PostgreSQL 16
# Stage 5 + command center: Task State Machine, Dispatcher, recovery, shared API limiter, dashboard UI tests

permissions:
  contents: read
on:
  pull_request:
    paths:
      - "jarvis/core/task-registry-store.js"
      - "jarvis/core/task-state-machine.js"
      - "jarvis/core/task-state-machine.test.js"
      - "jarvis/core/task-dispatcher.js"
      - "jarvis/core/task-dispatcher.test.js"
      - "jarvis/core/execution-recovery-scheduler.js"
      - "jarvis/core/execution-recovery-scheduler.test.js"
      - "jarvis/coordination/EXECUTION_KERNEL_STAGE5.md"
      - "jarvis/core/task-registry-store*.test.js"
      - "jarvis/core/task-registry-api.js"
      - "jarvis/core/task-registry-api.test.js"
      - "jarvis/core/task-registry-auth.js"
      - "jarvis/core/task-registry-auth.test.js"
      - "jarvis/server.js"
      - "jarvis/dashboard.js"
      - "jarvis/dashboard.test.js"
      - "jarvis/command-center-dashboard.js"
      - "jarvis/command-center-dashboard.test.js"
      - "jarvis/command-center-telemetry.test.js"
      - "jarvis/coordination/COMMAND_CENTER_TELEMETRY_STAGE2.md"
      - "jarvis/coordination/COMMAND_CENTER_STAGE3.md"
      - "jarvis/coordination/COMMAND_CENTER_STAGE4.md"
      - "jarvis/migrations/0004_task_registry.sql"
      - "jarvis/migrations/0005_task_registry_scoped_dedupe.sql"
      - "jarvis/migrations/0006_scheduling_reservation_store.sql"
      - "jarvis/core/postgres-scheduling-store.js"
      - "jarvis/core/postgres-scheduling-store.integration.test.js"
      - "jarvis/core/postgres-execution-kernel.js"
      - "jarvis/core/postgres-execution-kernel.integration.test.js"
      - "jarvis/core/postgres-task-registry-rate-limiter.js"
      - "jarvis/migrations/0007_execution_kernel_fencing.sql"
      - "jarvis/migrations/0008_worker_scope_grants.sql"
      - ".github/workflows/jarvis-task-registry.yml"
  push:
    branches:
      - "coordination/one-jarvis-task-registry-v1"
    paths:
      - "jarvis/core/task-registry-store.js"
      - "jarvis/core/task-registry-store*.test.js"
      - "jarvis/migrations/0004_task_registry.sql"
      - ".github/workflows/jarvis-task-registry.yml"
jobs:
  task-registry:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jarvis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-scheduling:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jarvis_scheduling_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jarvis_scheduling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-execution:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jarvis_execution_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jarvis_execution_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-operational:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jarvis_operational_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jarvis_operational_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: jarvis
        run: npm install
      - name: Run unit and PostgreSQL integration tests
        working-directory: jarvis
        env:
          JARVIS_TASK_REGISTRY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jarvis_test
          JARVIS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/jarvis_operational_test?sslmode=disable
          JARVIS_SCHEDULING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5434/jarvis_scheduling_test?sslmode=disable
          JARVIS_EXECUTION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5435/jarvis_execution_test?sslmode=disable
          JARVIS_ALLOW_TEST_SCHEMA_RESET: "yes"
        run: npm test
