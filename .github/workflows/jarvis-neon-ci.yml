name: ONE JARVIS Neon PostgreSQL CI

on:
  pull_request:
    branches: [jarvis-paper-trading-learning]
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-neon-ci.yml"
  push:
    branches: [feature/one-jarvis-neon-postgres-foundation, security/jarvis-postgres-append-only-ledger]
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-neon-ci.yml"

permissions:
  contents: read

concurrency:
  group: one-jarvis-neon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis_test
          POSTGRES_PASSWORD: jarvis_test_only
          POSTGRES_DB: one_jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_test -d one_jarvis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JARVIS_TEST_DATABASE_URL: postgresql://jarvis_test:jarvis_test_only@127.0.0.1:5432/one_jarvis_test?sslmode=disable
      JARVIS_ALLOW_TEST_SCHEMA_RESET: yes
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: echo "Running isolated local PostgreSQL integration tests; Neon is not used"
      - run: node --check core/postgres-event-store.js && node --check core/postgres-operational-stores.js && node --check server.js && node --check core/job-store.js && node --check core/approval-store.js && node --check core/worker.js && node --check core/approval-store.test.js && node --check core/postgres-operational-stores.test.js && node --check core/postgres-operational-stores.integration.test.js && node --check scripts/jsonl-migration-dry-run.js && node --check scripts/jsonl-migration-dry-run.test.js && node --check scripts/postgres-migration-rehearsal.js && node --check scripts/postgres-migration-rehearsal.test.js
