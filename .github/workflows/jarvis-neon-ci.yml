name: ONE JARVIS Neon PostgreSQL CI

on:
  pull_request:
    branches: [jarvis-paper-trading-learning]
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-neon-ci.yml"
  push:
    branches: [feature/one-jarvis-neon-postgres-foundation]
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-neon-ci.yml"

permissions:
  contents: read

concurrency:
  group: one-jarvis-neon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: test -z "$JARVIS_TEST_DATABASE_URL" || echo "Isolated PostgreSQL integration test explicitly enabled"
      - run: node --check core/postgres-event-store.js && node --check core/postgres-operational-stores.js && node --check server.js && node --check core/job-store.js && node --check core/approval-store.js && node --check core/worker.js && node --check core/approval-store.test.js && node --check core/postgres-operational-stores.test.js && node --check core/postgres-operational-stores.integration.test.js && node --check core/approval-store.test.js
