name: ONE JARVIS CI

on:
  push:
    branches: [one-jarvis-foundation, one-jarvis-neon-integration]
    paths:
      - "jarvis/**"
      - "apps-script/**"
      - ".github/workflows/jarvis-ci.yml"
  pull_request:
    branches: [one-jarvis-foundation]
    paths:
      - "jarvis/**"
      - "apps-script/**"
      - ".github/workflows/jarvis-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node --check < ../apps-script/Code.gs
      - run: node --test ../apps-script/Code.test.js
