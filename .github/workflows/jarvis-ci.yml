name: ONE JARVIS CI

on:
  push:
    branches: [one-jarvis-foundation]
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-ci.yml"
  pull_request:
    branches: [one-jarvis-foundation]
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
