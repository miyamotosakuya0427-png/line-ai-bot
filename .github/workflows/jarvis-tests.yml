name: ONE JARVIS tests

on:
  push:
    branches: [one-jarvis-foundation]
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-tests.yml"
  pull_request:
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-tests.yml"

permissions:
  contents: read

concurrency:
  group: one-jarvis-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
